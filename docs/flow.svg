<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="100%" role="img" aria-label="流程图">
  <title>处理流程</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d4662a"/>
    </marker>
  </defs>
  <g transform="translate(40,90)">
    <rect width="100" height="120" rx="14" fill="#ffffff" stroke="#d4662a" stroke-width="3"/>
    <text x="50" y="55" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">本机</text>
    <text x="50" y="82" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">提取可靠信号</text>
  </g>
  <line x1="140" y1="150" x2="160" y2="150" stroke="#d4662a" stroke-width="3" marker-end="url(#ar)"/>
  <g transform="translate(160,90)">
    <rect width="100" height="120" rx="14" fill="#ffffff" stroke="#d4662a" stroke-width="3"/>
    <text x="50" y="55" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">加密</text>
    <text x="50" y="82" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">AES-GCM 密文</text>
  </g>
  <line x1="260" y1="150" x2="280" y2="150" stroke="#d4662a" stroke-width="3" marker-end="url(#ar)"/>
  <g transform="translate(280,90)">
    <rect width="100" height="120" rx="14" fill="#ffffff" stroke="#d4662a" stroke-width="3"/>
    <text x="50" y="55" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">发布</text>
    <text x="50" y="82" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">临时链接+二维码</text>
  </g>
  <line x1="380" y1="150" x2="400" y2="150" stroke="#d4662a" stroke-width="3" marker-end="url(#ar)"/>
  <g transform="translate(400,90)">
    <rect width="100" height="120" rx="14" fill="#ffffff" stroke="#d4662a" stroke-width="3"/>
    <text x="50" y="55" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">手机</text>
    <text x="50" y="82" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">扫码打开</text>
  </g>
</svg>
