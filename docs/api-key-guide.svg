    <text x="50" y="55" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">本机</text>
    <text x="50" y="82" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">setup 存 Key</text>
  </g>
  <line x1="260" y1="150" x2="280" y2="150" stroke="#d4662a" stroke-width="3" marker-end="url(#ar)"/>
