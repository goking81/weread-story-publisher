    <text x="50" y="82" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">拿 wrk- Key</text>
  </g>
  <line x1="140" y1="150" x2="160" y2="150" stroke="#d4662a" stroke-width="3" marker-end="url(#ar)"/>
